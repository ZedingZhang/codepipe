[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepipe"
version = "0.1.0a1"
description = "Multi-language, local-first deterministic pipeline coding agent"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["coding-agent", "local-llm", "ollama", "code-generation", "agentless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "tree-sitter>=0.23.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
codepipe = "cli:app"

[project.urls]
Homepage = "https://github.com/ZedingZhang/codepipe"
Repository = "https://github.com/ZedingZhang/codepipe"
Issues = "https://github.com/ZedingZhang/codepipe/issues"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
